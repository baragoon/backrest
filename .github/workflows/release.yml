name: Tagged Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (required when dispatching from a branch)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  call-reusable-release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      snapshot: false
      tag: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    secrets: inherit
